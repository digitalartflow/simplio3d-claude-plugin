<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500" viewBox="0 0 500 500" role="img" aria-labelledby="title desc">
  <title id="title">Vectorized dark geometric S logo</title>
  <desc id="desc">A dark, faceted, angular S mark recreated as scalable SVG paths with transparent background.</desc>
  <defs>
    <linearGradient id="topBase" x1="20" y1="250" x2="489" y2="122" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#111923"/>
      <stop offset="0.45" stop-color="#202937"/>
      <stop offset="1" stop-color="#171f2b"/>
    </linearGradient>
    <linearGradient id="topFace" x1="12" y1="166" x2="303" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a1018"/>
      <stop offset="0.45" stop-color="#121a25"/>
      <stop offset="1" stop-color="#18212d"/>
    </linearGradient>
    <linearGradient id="bottomBase" x1="16" y1="382" x2="489" y2="305" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#121a25"/>
      <stop offset="0.5" stop-color="#18212d"/>
      <stop offset="1" stop-color="#111924"/>
    </linearGradient>
    <linearGradient id="bottomLeft" x1="14" y1="382" x2="201" y2="376" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#111925"/>
      <stop offset="1" stop-color="#192331"/>
    </linearGradient>
    <linearGradient id="centerBevel" x1="151" y1="207" x2="366" y2="294" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4b5662" stop-opacity="0.74"/>
      <stop offset="0.55" stop-color="#3b4651" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#1b2430" stop-opacity="0.42"/>
    </linearGradient>
    <linearGradient id="rightShade" x1="352" y1="218" x2="489" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1a2431" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#0c121b" stop-opacity="0.58"/>
    </linearGradient>
    <filter id="edgeSoft" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="0" stdDeviation="0.35" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <g filter="url(#edgeSoft)" shape-rendering="geometricPrecision">
    <!-- Lower ribbon -->
    <path id="lower-ribbon" d="M489 305 C489 291 481 280 464 271 L355 214 L351 214 L282 249 L365 293 L201 376 L198 376 L113 333 L14 382 L229 491 C235 494 246 495 253 493 L338 451 L474 380 C484 375 489 363 489 350 Z" fill="url(#bottomBase)" stroke="#03060b" stroke-width="1.15" stroke-linejoin="round"/>

    <!-- subtle facets in the lower ribbon -->
    <path d="M14 382 L113 333 L201 376 L107 424 Z" fill="url(#bottomLeft)" opacity="0.78"/>
    <path d="M282 249 L351 214 L464 271 C481 280 489 291 489 305 L489 350 C489 363 484 375 474 380 L365 293 Z" fill="url(#rightShade)" opacity="0.5"/>
    <path d="M107 424 L201 376 L365 293 L374 297 L203 384 L113 430 Z" fill="url(#centerBevel)" opacity="0.72"/>
    <path d="M107 424 L201 376 L365 293" fill="none" stroke="#65717c" stroke-width="0.85" opacity="0.42"/>
    <path d="M113 430 L203 384 L374 297" fill="none" stroke="#03070d" stroke-width="1.0" opacity="0.72"/>

    <!-- Upper ribbon -->
    <path id="upper-ribbon" d="M489 122 L278 10 C270 7 262 7 254 10 L21 134 C15 137 11 144 11 149 L12 248 C12 257 21 266 32 270 L174 343 C175 344 177 344 178 343 L302 282 C303 281 304 280 303 280 L150 202 C147 201 146 199 148 197 L266 136 L360 186 C362 187 364 187 366 186 L489 122 Z" fill="url(#topBase)" stroke="#03060b" stroke-width="1.15" stroke-linejoin="round"/>

    <!-- dark side/front face of the upper ribbon -->
    <path d="M11 149 L132 202 L303 280 L177 343 L32 270 C20 264 12 257 12 248 Z" fill="url(#topFace)" opacity="0.94"/>
    <path d="M132 202 L148 197 L303 280 L292 286 Z" fill="url(#centerBevel)" opacity="0.64"/>

    <!-- internal ridges and polished edge highlights -->
    <path d="M11 149 L132 202 L303 280" fill="none" stroke="#00040a" stroke-width="1.25" stroke-linecap="round" opacity="0.7"/>
    <path d="M132 202 L303 280" fill="none" stroke="#5a6570" stroke-width="0.9" stroke-linecap="round" opacity="0.42"/>
    <path d="M32 270 L177 343 L303 280" fill="none" stroke="#02050a" stroke-width="1.05" stroke-linejoin="round" opacity="0.78"/>
    <path d="M148 197 L266 136 L360 186" fill="none" stroke="#04070d" stroke-width="1.05" stroke-linejoin="round" opacity="0.7"/>
    <path d="M282 249 L365 293 L201 376" fill="none" stroke="#03060c" stroke-width="1.1" stroke-linejoin="round" opacity="0.78"/>
    <path d="M14 382 L113 333 L201 376" fill="none" stroke="#02050a" stroke-width="1.0" stroke-linejoin="round" opacity="0.74"/>
    <path d="M107 424 L201 376" fill="none" stroke="#293341" stroke-width="0.75" opacity="0.35"/>
  </g>
</svg>
